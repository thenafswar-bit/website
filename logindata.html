<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Log in &middot; Nafs Warrior</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #f2efe6;
  --bg-alt: #eae6da;
  --bg-card: #faf8f2;
  --sage: #9cb194;
  --sage-mid: #7a9972;
  --sage-dark: #40442c;
  --sage-pale: #dce8d4;
  --sage-wash: #eef4e8;
  --ink: #2a2d1a;
  --ink-mid: #3e4228;
  --ink-soft: #677055;
  --ink-dim: #99a882;
  --gold: #857040;
  --red: #a23b3b;
  --green: #3e6b4a;
  --line: rgba(64,68,44,.13);
  --line-strong: rgba(64,68,44,.24);
  --shadow: rgba(42,45,26,.10);
  --btn-fill: #40442c;
  --btn-fill-hover: #2d3019;
  --btn-text: #f2efe6;
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Manrope', sans-serif;
}
[data-theme="dark"] {
  --bg: #2a2d1a;
  --bg-alt: #323520;
  --bg-card: #3a3e26;
  --sage-dark: #c8d8c0;
  --sage-pale: #3a3e26;
  --sage-wash: #40442c;
  --ink: #f2efe6;
  --ink-mid: #ddd9ca;
  --ink-soft: #9cb194;
  --ink-dim: #7a8a6a;
  --gold: #c9a862;
  --red: #e58a8a;
  --green: #9cc9a8;
  --line: rgba(156,177,148,.15);
  --line-strong: rgba(156,177,148,.28);
  --shadow: rgba(0,0,0,.40);
  --btn-fill: #9cb194;
  --btn-fill-hover: #b5c8ae;
  --btn-text: #2a2d1a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg); color: var(--ink);
  line-height: 1.8; min-height: 100svh;
  transition: background .3s ease, color .3s ease;
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg-card);
  display: flex; justify-content: space-between; align-items: center;
  gap: .8rem; padding: .6rem 1.5rem; min-height: 56px;
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 10px var(--shadow);
}
[data-theme="dark"] header { background: rgba(64,68,44,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; cursor: pointer; color: inherit; }
.brand-logo { width: 40px; height: 40px; }
.brand-name { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; color: var(--sage-dark); letter-spacing: -1px; }
.mode-toggle {
  background: var(--btn-fill); color: var(--btn-text); border: none;
  padding: .6rem 1.1rem; border-radius: 50px; cursor: pointer;
  font-family: var(--font-body); font-size: .85rem; font-weight: 600;
  transition: background .2s ease, transform .2s ease;
}
.mode-toggle:hover { background: var(--btn-fill-hover); transform: translateY(-2px); }
.auth-wrap { max-width: 420px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
.auth-card {
  background: var(--bg-card); border: 1px solid var(--line-strong);
  border-radius: 16px; padding: 2.2rem 2rem;
  box-shadow: 0 20px 50px var(--shadow);
}
[data-theme="dark"] .auth-card { background: rgba(64,68,44,.4); }
.auth-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; color: var(--sage-dark); text-align: center; letter-spacing: -1px; }
.auth-sub { text-align: center; color: var(--ink-soft); font-size: .92rem; margin: .4rem 0 1.4rem; }

/* Tabs */
.tabs { display: flex; background: var(--bg-alt); border: 1px solid var(--line-strong); border-radius: 50px; padding: .25rem; margin-bottom: 1.6rem; }
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  font-family: var(--font-body); font-size: .88rem; font-weight: 700;
  color: var(--ink-soft); padding: .55rem .5rem; border-radius: 50px;
  transition: all .2s ease;
}
.tab.active { background: var(--btn-fill); color: var(--btn-text); }
.tab:hover:not(.active) { color: var(--sage-dark); }

.field { margin-bottom: 1.1rem; }
.field label { font-size: .8rem; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: .3rem; }
.field input {
  width: 100%;
  background: var(--bg-alt); border: 1px solid var(--line-strong); color: var(--ink);
  padding: 12px 14px; border-radius: 10px; font-size: 16px; font-family: var(--font-body);
  outline: none; transition: border-color .2s ease;
}
.field input:focus { border-color: var(--sage-mid); }
.btn-fill {
  width: 100%; background: var(--btn-fill); color: var(--btn-text); border: none;
  padding: .85rem 1.6rem; border-radius: 50px; cursor: pointer;
  font-family: var(--font-body); font-size: .95rem; font-weight: 700;
  transition: background .2s ease, transform .2s ease;
}
.btn-fill:hover { background: var(--btn-fill-hover); transform: translateY(-2px); }
.btn-fill[disabled] { opacity: .6; cursor: not-allowed; transform: none; }
.msg { display: none; font-size: .85rem; line-height: 1.6; margin-top: 1rem; padding: .75rem 1rem; border-radius: 10px; text-align: center; }
.msg.error { display: block; background: rgba(162,59,59,.1); border: 1px solid rgba(162,59,59,.35); color: var(--red); }
.msg.info { display: block; background: rgba(62,107,74,.1); border: 1px solid rgba(62,107,74,.35); color: var(--green); }
.auth-note { text-align: center; font-size: .8rem; color: var(--ink-dim); margin-top: 1.2rem; }

/* Success */
.success-screen { display: none; text-align: center; padding: 2.5rem 1.5rem; }
.success-screen .tick {
  width: 84px; height: 84px; margin: 0 auto 1.2rem; border-radius: 50%;
  background: var(--sage); color: var(--btn-text);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 14px 34px var(--shadow);
}
.success-screen .tick svg { width: 40px; height: 40px; }
.success-screen h2 { font-family: var(--font-display); font-size: 2rem; color: var(--sage-dark); }
.success-screen p { color: var(--ink-soft); margin-top: .4rem; }
.success-actions { display: flex; gap: .7rem; justify-content: center; margin-top: 1.4rem; flex-wrap: wrap; }
.success-actions .btn-ghost { margin-top: 0; }
.btn-ghost {
  display: inline-block; text-decoration: none;
  background: var(--sage-wash); color: var(--sage-dark); border: 1px solid var(--line-strong);
  padding: .7rem 1.5rem; border-radius: 50px; cursor: pointer;
  font-family: var(--font-body); font-size: .88rem; font-weight: 700;
  transition: background .2s ease, transform .2s ease;
}
.btn-ghost:hover { background: var(--sage); color: var(--btn-text); transform: translateY(-2px); }
footer { text-align: center; padding: 2rem 1rem 2.5rem; color: var(--ink-soft); font-size: .82rem; }
footer a { color: var(--sage-dark); font-weight: 600; cursor: pointer; text-decoration: none; }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <svg class="brand-logo" viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <circle cx="60" cy="60" r="56" fill="var(--sage-mid)" opacity=".85"/>
      <path d="M60 22 A38 38 0 1 0 60.001 22" stroke="var(--sage-pale)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <line x1="60" y1="58" x2="60" y2="22" stroke="var(--sage-pale)" stroke-width="5.5" stroke-linecap="round"/>
      <polyline points="47,34 60,21 73,34" stroke="var(--sage-pale)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="brand-name">Nafs Warrior</span>
  </a>
  <button class="mode-toggle" onclick="toggleDarkMode()">Dark Mode</button>
</header>

<main class="auth-wrap">
  <div class="auth-card" id="auth-form">
    <h1 class="auth-title" id="auth-heading">Log in</h1>
    <p class="auth-sub">Your journey is saved to your account.</p>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="setMode('login')">Log in</button>
      <button class="tab" id="tab-signup" onclick="setMode('signup')">Sign up</button>
    </div>

    <form id="auth-form-el" onsubmit="handleAuth(event)">
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" required/>
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="Your password" autocomplete="current-password" required/>
      </div>
      <div class="field" id="confirm-wrap" style="display:none;">
        <label for="auth-confirm">Confirm password</label>
        <input type="password" id="auth-confirm" placeholder="Repeat your password" autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn-fill" id="auth-submit">Log in</button>
      <div class="msg" id="auth-msg"></div>
    </form>

    <p class="auth-note" id="auth-note">Any data you save on the site is linked to this account.</p>
  </div>

  <div class="auth-card" id="auth-success">
    <div class="success-screen">
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h2 id="success-title">You are logged in</h2>
      <p id="success-body">May this journey be a means of drawing closer to Allah.</p>
      <div class="success-actions">
        <a class="btn-ghost" href="progress.html">View My Progress</a>
        <a class="btn-ghost" href="index.html">Continue to the site</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <p><strong>Nafs Warrior</strong> &mdash; <span>Win the War Within</span></p>
  <p style="margin-top:.4rem;"><a href="index.html">Back to home</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync-progress.js"></script>
<script>
/* ===== Supabase ===== */
var supabaseUrl = 'https://znyiqznuvqxcdkxwlpzd.supabase.co';
var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueWlxem51dnF4Y2RreHdscHpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDcwMzIsImV4cCI6MjEwNTIyMzAzMn0.5CvlmXBAg2VXNd7Gp-nq__ZgPiT9p9DjAEObnZaTXXI';
var supabase = window.supabase ? window.supabase.createClient(supabaseUrl, supabaseKey) : null;

/* ===== Theme ===== */
function toggleDarkMode() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  document.querySelector('.mode-toggle').textContent = newTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
}
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.querySelector('.mode-toggle').textContent = 'Light Mode';
}

/* ===== Mode (login / signup) ===== */
var mode = 'login';
function setMode(m) {
  mode = m;
  document.getElementById('tab-login').classList.toggle('active', m === 'login');
  document.getElementById('tab-signup').classList.toggle('active', m === 'signup');
  document.getElementById('auth-heading').textContent = m === 'login' ? 'Log in' : 'Sign up';
  document.getElementById('auth-submit').textContent = m === 'login' ? 'Log in' : 'Create account';
  document.getElementById('confirm-wrap').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('auth-note').textContent = m === 'login'
    ? 'Any data you save on the site is linked to this account.'
    : 'Creating an account lets your progress follow you on this device.';
  document.getElementById('auth-password').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
  showMsg(null);
}

function showMsg(obj) {
  var box = document.getElementById('auth-msg');
  box.className = 'msg' + (obj ? (' ' + obj.type) : '');
  if (obj) box.textContent = obj.text;
  else box.textContent = '';
}

function setLoading(on) {
  document.getElementById('auth-submit').disabled = on;
  document.getElementById('auth-submit').textContent = on
    ? 'Please wait&hellip;'.replace('&hellip;', '…')
    : (mode === 'login' ? 'Log in' : 'Create account');
}

function friendlyError(e) {
  var m = (e && e.message) ? e.message : 'Something went wrong. Please try again.';
  if (/invalid login credentials/i.test(m)) return 'The email or password is incorrect.';
  if (/already registered/i.test(m)) return 'An account with this email already exists. Try logging in instead.';
  if (/password should be at least 6 characters/i.test(m)) return 'Password must be at least 6 characters.';
  if (/password confirmation does not match/i.test(m)) return 'The passwords do not match.';
  return m;
}

/* ===== Submit ===== */
async function handleAuth(e) {
  e.preventDefault();
  if (!supabase) {
    showMsg({ type: 'error', text: 'Could not load the login service. Please check your connection and try again.' });
    return;
  }
  var email = document.getElementById('auth-email').value.trim();
  var password = document.getElementById('auth-password').value;

  if (mode === 'signup') {
    var confirm = document.getElementById('auth-confirm').value;
    if (password !== confirm) {
      showMsg({ type: 'error', text: 'The passwords do not match.' });
      return;
    }
  }

  setLoading(true);
  showMsg(null);

  try {
    if (mode === 'login') {
      var login = await supabase.auth.signInWithPassword({ email: email, password: password });
      if (login.error) throw login.error;
      finishAuth('You are logged in', 'May this journey be a means of drawing closer to Allah.');
    } else {
      var redirectTo = window.location.origin.indexOf('http') === 0
        ? window.location.origin + '/logindata.html'
        : 'http://localhost:5500/logindata.html';
      var signup = await supabase.auth.signUp({
        email: email,
        password: password,
        options: { emailRedirectTo: redirectTo }
      });
      if (signup.error) throw signup.error;
      if (signup.data && signup.data.session) {
        finishAuth('Account created', 'Welcome, and may Allah accept your efforts.');
      } else {
        finishAuth('Almost there', 'Open your Gmail inbox now. Click the link in the email from Supabase — check Spam if you do not see it. Once verified, come back here and log in.');
      }
    }
  } catch (err) {
    setLoading(false);
    showMsg({ type: 'error', text: friendlyError(err) });
  }
}

function finishAuth(title, body) {
  document.getElementById('success-title').textContent = title;
  document.getElementById('success-body').textContent = body;
  document.getElementById('auth-form').style.display = 'none';
  document.getElementById('auth-success').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  /* Attach any progress saved on this device to the account */
  if (window.SyncProgress) {
    window.SyncProgress.push().catch(function () {});
  }
}

/* Skip the form if already signed in */
if (supabase) {
  supabase.auth.getSession().then(function (res) {
    if (res && res.data && res.data.session) {
      finishAuth('You are logged in', 'Welcome back. May Allah accept your efforts.');
    }
  }).catch(function () {});
}
</script>
<script src="track.js"></script>
</body>
</html>

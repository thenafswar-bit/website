<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Music Tool &middot; The Full 21-Day Journey &mdash; Nafs Warrior</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
<style>

  :root {
    --bg: #f2efe6; --bg-alt: #eae6da; --bg-card: #faf8f2;
    --sage: #9cb194; --sage-mid: #7a9972; --sage-dark: #40442c;
    --sage-pale: #dce8d4; --sage-wash: #eef4e8;
    --ink: #2a2d1a; --ink-mid: #3e4228; --ink-soft: #677055; --ink-dim: #99a882;
    --gold: #857040;
    --line: rgba(64,68,44,.13); --line-strong: rgba(64,68,44,.24);
    --shadow: rgba(42,45,26,.10);
    --btn-fill: #40442c; --btn-fill-hover: #2d3019; --btn-text: #f2efe6;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Manrope', system-ui, sans-serif;
    --font-arabic: 'Amiri', serif;
  }
  [data-theme="dark"] {
    --bg: #2a2d1a; --bg-alt: #323520; --bg-card: #3a3e26;
    --sage: #9cb194; --sage-mid: #b5c8ae; --sage-dark: #c8d8c0;
    --sage-pale: #3a3e26; --sage-wash: #40442c;
    --ink: #f2efe6; --ink-mid: #ddd9ca; --ink-soft: #9cb194; --ink-dim: #7a8a6a;
    --gold: #c9a862;
    --line: rgba(156,177,148,.15); --line-strong: rgba(156,177,148,.28);
    --shadow: rgba(0,0,0,.40);
    --btn-fill: #9cb194; --btn-fill-hover: #b5c8ae; --btn-text: #2a2d1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100svh; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center; gap: .8rem;
    padding: .7rem clamp(1rem, 4vw, 2rem);
    background: var(--bg-card); border-bottom: 1px solid var(--line);
  }
  .topbar .back-link {
    font-size: .9rem; font-weight: 600; color: var(--sage-mid); text-decoration: none;
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .45rem .8rem; border-radius: 50px;
    background: var(--sage-wash); border: 1px solid var(--line-strong);
    transition: background .2s, transform .2s;
  }
  .topbar .back-link:hover { background: var(--sage); color: var(--btn-text); transform: translateY(-2px); }
  .mode-toggle {
    background: var(--btn-fill); color: var(--btn-text); border: none;
    padding: .55rem 1rem; border-radius: 50px; cursor: pointer;
    font-size: .85rem; font-weight: 600;
    transition: background .2s ease, transform .2s ease;
  }
  .mode-toggle:hover { background: var(--btn-fill-hover); transform: translateY(-2px); }
  .streak-pill {
    display: inline-flex; align-items: center; gap: .4rem;
    font-size: .8rem; font-weight: 700; color: var(--gold);
    background: var(--sage-wash); border: 1px solid var(--line-strong);
    padding: .4rem .8rem; border-radius: 50px; white-space: nowrap;
  }
  .streak-pill svg { width: 15px; height: 15px; }
  .streak-pill.complete { background: var(--gold); color: #fff; border-color: var(--gold); }

  .wrap { max-width: 700px; margin: 0 auto; padding: calc(76px + 1rem) 1.2rem 4rem; }

  /* ==== Intro / Week home ==== */
  .hero { text-align: center; margin-bottom: 2rem; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--sage-mid); font-weight: 700;
    background: rgba(143,168,136,.14); padding: 6px 14px; border-radius: 999px;
    margin-bottom: 16px;
  }
  h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; margin-bottom: 10px;
    color: var(--sage-dark);
  }
  .hero p.sub { color: var(--ink-soft); max-width: 520px; margin: 0 auto; font-size: 15px; }
  .listen-read {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px;
  }
  .btn {
    font-family: var(--font-body); font-weight: 700; font-size: 15px;
    border: none; border-radius: 999px; padding: 14px 30px; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary {
    background: linear-gradient(135deg, #40442c, #7a9972); color: #fff;
    box-shadow: 0 10px 22px -10px rgba(95,122,90,.6);
  }
  [data-theme="dark"] .btn-primary { background: linear-gradient(135deg, #9cb194, #6b7455); color: #2a2d1a; }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-ghost {
    background: transparent; color: var(--sage-dark);
    border: 2px solid var(--sage-mid);
  }
  .btn-ghost:hover { background: var(--sage-wash); }
  .btn-gold { background: var(--gold); color: #fff; }
  .btn-gold:hover { transform: translateY(-2px); }

  .progress-line { margin-top: 26px; text-align: center; }
  .progress-line .lbl { font-size: .8rem; font-weight: 700; color: var(--ink-soft); letter-spacing: .12em; text-transform: uppercase; }
  .dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 10px auto 0; max-width: 520px; }
  .dots .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: rgba(122,153,114,.25); transition: all .3s ease;
  }
  .dots .dot.done { background: var(--gold); width: 30px; border-radius: 6px; }

  /* ==== Week grid ==== */
  .week-card {
    background: var(--bg-card); border: 1px solid var(--line-strong);
    border-radius: 20px; padding: clamp(20px, 4vw, 30px); margin-top: 14px;
    box-shadow: 0 18px 44px -24px var(--shadow);
  }
  .week-card h2 { font-family: var(--font-display); font-size: 1.6rem; color: var(--sage-dark); margin-bottom: 4px; }
  .week-card > p { color: var(--ink-soft); font-size: 14px; margin-bottom: 18px; }
  .day-list { display: flex; flex-direction: column; gap: 10px; }
  .day-item {
    display: flex; align-items: center; gap: 14px;
    background: var(--sage-wash); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; cursor: pointer;
    transition: transform .2s ease, border-color .2s ease, opacity .2s ease;
    text-align: left; font-family: var(--font-body);
  }
  .day-item:hover { transform: translateX(4px); border-color: var(--sage); }
  .day-item.locked { opacity: .55; cursor: not-allowed; }
  .day-item.locked:hover { transform: none; border-color: var(--line); }
  .day-status {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--sage-mid); color: transparent;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .day-item.done .day-status { background: var(--gold); border-color: var(--gold); color: #fff; }
  .day-item.locked .day-status { border-color: var(--ink-dim); }
  .day-title { flex: 1; font-size: 15px; font-weight: 700; color: var(--ink); }
  .day-title small { display: block; font-weight: 500; color: var(--ink-soft); font-size: 12.5px; }
  .day-arrow { color: var(--sage-mid); font-weight: 700; }
  .day-item.done .day-arrow { color: var(--gold); }

  .week2-card {
    margin-top: 16px; border: 1px dashed var(--sage-mid); border-radius: 20px;
    padding: 24px; text-align: center; background: var(--bg-alt);
  }
  .week2-card.locked .lock {
    width: 46px; height: 46px; margin: 0 auto 10px; color: var(--ink-dim);
  }
  .week2-card.locked h3 { color: var(--ink-soft); font-size: 1.15rem; }
  .week2-card.locked p { color: var(--ink-dim); font-size: 13px; }
  .week2-card.unlocked { border-style: solid; background: rgba(181,200,174,.25); }
  .week2-card.unlocked h3 { color: var(--sage-dark); font-family: var(--font-display); font-size: 1.5rem; }
  .week2-card.unlocked p { color: var(--ink-soft); }

  /* ==== Day reading view ==== */
  .day-head { margin-bottom: 22px; }
  .day-head .back { color: var(--sage-mid); cursor: pointer; font-size: .9rem; font-weight: 600; }
  .day-head h2 { font-family: var(--font-display); font-size: clamp(1.7rem, 5vw, 2.3rem); color: var(--sage-dark); line-height: 1.2; margin: 8px 0 4px; }
  .day-head p { color: var(--ink-soft); font-size: 14px; }
  .para {
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 24px; margin-bottom: 14px;
    font-size: 15.5px; color: var(--ink-mid); line-height: 1.85;
    box-shadow: 0 12px 30px -20px var(--shadow);
    animation: rise .45s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .para b { color: var(--sage-dark); font-weight: 700; }
  .para .sub { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .para .ref { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 10px; border-top: 1px dashed var(--line-strong); padding-top: 10px; }
  .para ul { margin: 8px 0 0 18px; }
  .para li { margin-bottom: 4px; }
  .para .ayah { font-family: var(--font-arabic); direction: rtl; text-align: center; font-size: 1.25rem; color: var(--sage-dark); margin: 8px 0; line-height: 2; }
  .para .dua { text-align: center; font-size: 1.05rem; color: var(--sage-dark); font-weight: 700; }

  .reveal-row { text-align: center; margin: 20px 0 8px; }

  /* ==== End of day ==== */
  .end-card {
    background: var(--bg-card); border: 1px solid var(--line-strong);
    border-radius: 20px; padding: 26px; text-align: center; margin-top: 22px;
    box-shadow: 0 18px 44px -24px var(--shadow);
  }
  .end-card .tag { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .end-card h3 { font-family: var(--font-display); font-size: 1.5rem; color: var(--sage-dark); margin: 6px 0 8px; }
  .end-card p { color: var(--ink-soft); font-size: 14.5px; }
  .end-card .tomorrow {
    background: var(--sage-wash); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; margin: 18px 0; text-align: left; font-size: 14.5px; color: var(--ink-mid);
  }
  .end-card .tomorrow b { color: var(--sage-dark); }
  .end-card .btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--btn-fill); color: var(--btn-text); z-index: 100;
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    box-shadow: 0 12px 30px var(--shadow); text-align: center; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .banner {
    background: linear-gradient(135deg, rgba(181,200,174,.4), rgba(133,112,64,.18));
    border: 1px solid var(--sage); border-radius: 16px; padding: 18px 20px;
    text-align: center; margin-bottom: 18px;
  }
  .banner h3 { font-family: var(--font-display); font-size: 1.4rem; color: var(--sage-dark); }
  .banner p { color: var(--ink-soft); font-size: 14px; }

  /* ==== Week 2 Â· Journal challenge ==== */
  .note-box {
    background: var(--sage-wash); border: 1px dashed var(--sage-mid);
    border-radius: 14px; padding: 14px 16px; font-size: 13.5px; color: var(--ink-soft);
    margin-bottom: 16px; line-height: 1.6;
  }
  .note-box b { color: var(--sage-dark); }
  .checklist { display: flex; flex-direction: column; gap: 12px; margin: 18px 0; }
  .check-item {
    background: var(--bg-card); border: 1px solid var(--line-strong);
    border-radius: 16px; padding: 16px 18px; cursor: pointer;
    display: flex; gap: 14px; align-items: flex-start;
    transition: border-color .2s ease, background .2s ease, transform .15s ease;
    text-align: left; font-family: var(--font-body);
  }
  .check-item:hover { border-color: var(--sage); transform: translateX(3px); }
  .check-item.checked { background: var(--sage-wash); border-color: var(--sage); }
  .check-box {
    flex-shrink: 0; width: 26px; height: 26px; margin-top: 2px;
    border-radius: 8px; border: 2px solid var(--sage-mid); background: var(--bg-card);
    display: flex; align-items: center; justify-content: center;
    color: transparent; font-weight: 800; font-size: 15px;
    transition: all .2s ease;
  }
  .check-item.checked .check-box { background: var(--gold); border-color: var(--gold); color: #fff; }
  .check-item .q { font-weight: 700; color: var(--ink); font-size: 15px; }
  .check-item .hint { display: block; color: var(--ink-soft); font-size: 13px; font-weight: 500; margin-top: 3px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
  .exercise-card {
    background: var(--bg-card); border: 1px solid var(--line-strong);
    border-radius: 18px; padding: 22px; margin-top: 14px;
  }
  .exercise-card h4 { font-family: var(--font-display); font-size: 1.25rem; color: var(--sage-dark); margin-bottom: 6px; }
  .exercise-card p { color: var(--ink-soft); font-size: 14.5px; }
  .week-progress { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .week-progress .lbl { font-size: .75rem; font-weight: 700; color: var(--ink-soft); letter-spacing: .12em; text-transform: uppercase; }
  .week-progress .dots { margin-top: 0; }
  .why-box { text-align: left; }
  .why-box label { font-size: 15px; font-weight: 700; color: var(--ink); }
  .why-box textarea {
    width: 100%; min-height: 130px; resize: vertical;
    background: var(--bg-card); border: 1px solid var(--line-strong);
    border-radius: 14px; padding: 14px 16px; font-family: var(--font-body);
    font-size: 14.5px; color: var(--ink); line-height: 1.7; margin-top: 8px;
  }
  .why-box textarea:focus { outline: none; border-color: var(--sage); }
  .saved-why { margin-top: 12px; background: var(--sage-wash); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--ink-mid); white-space: pre-wrap; }

  /* ==== Week 3 Â· Toolkit ==== */
  .opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
  .opt-card {
    background: var(--bg-card); border: 1px solid var(--line-strong); border-radius: 18px;
    padding: 20px; cursor: pointer; text-align: left; font-family: var(--font-body);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .opt-card:hover { transform: translateY(-3px); border-color: var(--sage); box-shadow: 0 16px 34px -22px var(--shadow); }
  .opt-card .on { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; color: var(--gold); }
  .opt-card h3 { font-family: var(--font-display); font-size: 1.3rem; color: var(--sage-dark); margin: 4px 0 6px; }
  .opt-card p { color: var(--ink-soft); font-size: 13.5px; line-height: 1.6; }
  .acc { margin-top: 14px; }
  .acc-item { background: var(--bg-card); border: 1px solid var(--line-strong); border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  .acc-head {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--bg-card); border: none; padding: 16px 18px; cursor: pointer; text-align: left;
    font-family: var(--font-body); font-size: 15px; font-weight: 700; color: var(--ink);
  }
  .acc-head .caret { color: var(--sage-mid); font-weight: 700; transition: transform .2s ease; }
  .acc-item.open .caret { transform: rotate(90deg); }
  .acc-body { display: none; padding: 4px 18px 18px; }
  .acc-item.open .acc-body { display: block; animation: rise .3s ease; }
  .acc-body ol { margin: 6px 0 10px 18px; }
  .acc-body li { color: var(--ink-mid); font-size: 14px; line-height: 1.75; margin-bottom: 8px; }
  .acc-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; font-size: 13.5px; text-decoration: none; }
  .acc-link:hover { text-decoration: underline; }
  .step-card { display: flex; gap: 16px; align-items: flex-start; background: var(--bg-card); border: 1px solid var(--line-strong); border-radius: 16px; padding: 18px; margin-top: 12px; }
  .step-num { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .step-card h4 { font-size: 15px; color: var(--ink); margin-bottom: 3px; }
  .step-card p { color: var(--ink-soft); font-size: 13.5px; line-height: 1.6; }
  .placeholder-note {
    margin-top: 16px; background: var(--bg-alt); border: 1px dashed var(--sage-mid); border-radius: 14px;
    padding: 16px; text-align: center; color: var(--ink-soft); font-size: 13.5px;
  }
  .tech-card { background: var(--bg-card); border: 1px solid var(--line-strong); border-radius: 18px; padding: 22px; margin-top: 14px; }
  .tech-card h3 { font-family: var(--font-display); font-size: 1.25rem; color: var(--sage-dark); margin-bottom: 6px; }
  .tech-card p { color: var(--ink-mid); font-size: 14.5px; line-height: 1.75; }
  .tech-card ul { margin: 10px 0 0 18px; }
  .tech-card li { color: var(--ink-mid); font-size: 14px; margin-bottom: 6px; }
  .tech-card .tip { margin-top: 12px; background: var(--sage-wash); border-left: 3px solid var(--sage); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--ink-mid); }
  .redirect-row { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .redirect-btn {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--sage-wash); border: 1px solid var(--line-strong); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; text-align: left; font-family: var(--font-body);
    transition: border-color .18s ease, transform .18s ease;
  }
  .redirect-btn:hover { border-color: var(--sage); transform: translateX(3px); }
  .redirect-btn b { color: var(--ink); font-size: 14px; }
  .redirect-btn span { color: var(--ink-soft); font-size: 12.5px; }
  .redirect-btn .r-arrow { color: var(--gold); font-weight: 800; }
  .track-wrap { margin-top: 22px; }
  .track-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 12px; }
  .track-day {
    aspect-ratio: 1 / 1; border-radius: 14px; border: 2px solid var(--line-strong); background: var(--bg-card);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--ink-soft);
    transition: all .18s ease;
  }
  .track-day small { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .track-day.clean { background: var(--sage-mid); border-color: var(--sage-mid); color: #fff; }
  .track-day.slipped { background: var(--gold); border-color: var(--gold); color: #fff; }
  .track-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }
  .track-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; }
  .track-stats { margin-top: 14px; font-size: 14px; color: var(--ink-mid); }
  .track-stats b { color: var(--sage-dark); }
  .motivate {
    margin-top: 18px; background: var(--bg-card); border: 1px solid var(--gold); border-radius: 18px; padding: 22px;
    box-shadow: 0 14px 34px -22px var(--shadow);
  }
  .motivate h3 { font-family: var(--font-display); color: var(--sage-dark); font-size: 1.3rem; margin-bottom: 6px; }
  .motivate > p { color: var(--ink-soft); font-size: 14px; margin-bottom: 10px; }
  .motivate ol { margin: 0 0 8px 18px; }
  .motivate li { color: var(--ink-mid); font-size: 14px; line-height: 1.75; margin-bottom: 8px; }
  .motivate .motivate-end { font-family: var(--font-display); font-size: 1.1rem; color: var(--sage-dark); font-weight: 700; text-align: center; margin: 12px 0 0; }

  @media (max-width: 480px) {
    .track-day { font-size: 11px; }
    .track-day small { font-size: 8px; }
    .para { padding: 18px 16px; font-size: 15px; }
    .day-item { padding: 12px 12px; }
    .btn { padding: 13px 22px; font-size: 14px; width: 100%; }
    .listen-read { flex-direction: column; width: 100%; }
    .streak-pill { font-size: .72rem; padding: .35rem .6rem; }
  }

</style>
</head>
<body>

<script>
var WEEK1 = {
  title: 'A Question Worth Asking',
  days: [
    {
      title: 'Why Love Allah?',
      paras: [
        `<b class="sub">A Question Worth Asking</b>Music has become so woven into the fabric of our lives that we rarely stop to question it. It wakes us up in the morning, accompanies us on long drives, fills the silence while we study, comforts us when we're hurting, and celebrates with us when we're happy. For many of us, it has become less of an activity and more of a companion â€” something that is always there, something we instinctively reach for. But perhaps that is exactly why it deserves to be questioned. <b>Some of the most influential things in our lives are the ones we hardly notice anymore.</b> We often ask whether music is permissible or impermissible. We debate rulings, quote scholars, and argue over differences of opinion. But have we even asked ourselves: <b>what does music even mean for us? What does it do for us? What does it do to us?</b> If not, then you are at the right place, right now, my fellow akh / ukhti.`,
        `<b class="sub">Before Anything, a Dua</b>Many of us have heard countless times that music is haram, but we often dismiss the fact. Why? Maybe because we don't understand the wisdom behind this command, or we don't have that love in our hearts for Allah to obey what He said. If I am being honest, I don't even really blame you â€” usually, we are always taught to fear Allah, and barely ever to love Him. So before jumping into any commands, I just want to discuss a few things with you, as a sister. And before starting, I'd like to make dua that whatever I write now benefits you and me. <b class="dua">Ameen, suma ameen.</b>`,
        `<b class="sub">Why Should We Even Love Allah?</b>Think about your very first breath. Before anyone knew your name, before you had earned anything, before you had done a single good deed, <b>Allah had already chosen life for you.</b> He designed every detail of you with wisdom â€” the color of your eyes, the rhythm of your heartbeat, the family you were born into, and every moment that would shape your journey. <b>You are not an accident. You are a deliberate creation of a Lord who creates with purpose.</b>`,
        `Every morning you wake up, your heart continues beating without your permission. Your lungs continue breathing while you sleep. Your blood flows through thousands of miles of vessels every single day. We rarely stop to think about it, because these blessings are constant. Yet <b>every heartbeat is a silent reminder that Allah is sustaining us every second.</b> If He withheld His mercy for even a moment, none of us could survive.`,
        `Look around you. The sky does not collapse upon us. The sun rises with incredible precision. Rain falls exactly where Allah wills. Tiny seeds split open beneath the earth and become towering trees that provide shade, food, and beauty. <b>Every leaf, every mountain, every ocean, and every star is a sign pointing toward its Creator.</b> The universe is not random â€” it is a masterpiece constantly introducing us to Allah.`,
        `The same Lord who created Prophet Muhammad ï·º is our Lord. The same Lord who spoke to Musa (AS), who saved Nuh (AS), who answered the du'a of Yunus (AS) in the darkness of the whale â€” that very same Allah is your Allah. <b>He is the One who took care of you even when you failed to obey Him.</b> The One who continued blessing you despite knowing every sin you had committed. The One who sees you without you having to perform for Him. <b>He hears every whisper, every silent thought, every sob that never leaves your lips. He sees. He hears. And He never stops knowing.</b>`
      ],
      tomorrow: `<b>Coming tomorrow:</b> the moment you were at rock bottom â€” when everyone left and you felt completely alone â€” who was really there? Allah. And the verse where Allah still calls you <b>O My servant</b>.`
    },
    {
      title: 'Rock Bottom & the Mercy of Allah',
      paras: [
        `<b class="sub">I Want You to Think About This</b>Has there ever been a moment in your life when you genuinely believed there was no way out? A moment when your heart was so heavy that living itself felt unbearable? A time when everyone seemed to leave you â€” friends drifted away, family couldn't understand, and you felt completely alone? <b>Who was there? Allah. Who carried you through it? Allah. Who made sure your heart kept beating? Allah.</b> Who still provided food for your table, clothes on your back, air in your lungs, and another sunrise to witness? <b>Allah.</b>`,
        `He was there even when you forgot Him. Even when you disobeyed Him. Not once. Not twice. But countless times. <b>People leave after one mistake. People stop talking to you. People give up on you.</b> But Allah â€” the One who is completely free of all needs, the One who <b>"neither begets nor is born" (Surah Al-Ikhlas)</b> â€” still calls you with love.`,
        `He doesn't say, "O sinner." He doesn't say, "O failure." He says: <b>"Say, 'O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the All-Forgiving, the Most Merciful.'" (Qur'an 39:53)</b>`,
        `Read that again. "O My servants..." Even after all their sins, even after all their mistakes, <b>He still calls them His.</b> How could we not love such a Lord? How?`,
        `<b class="sub">More Merciful Than a Mother</b>The Prophet ï·º once asked the companions after seeing a mother desperately searching for her child. When she finally found him, she held him tightly and began nursing him. The Prophet ï·º asked, <b>"Do you think this woman would throw her child into the Fire?"</b> They replied, "No, by Allah." He then said, <b>"Allah is more merciful to His servants than this mother is to her child." (Sahih al-Bukhari and Sahih Muslim)</b>`,
        `Allah is our Lord, who loves us more than our mothers â€” so, so many times more. If that is the love and concern of someone who is only a creation of Allah, then what about the Creator Himself?`
      ],
      tomorrow: `<b>Coming tomorrow:</b> the typical-mum phone story, why Allah's restrictions are mercy, and the evidence that music is haram.`
    },
    {
      title: 'A Mother\u2019s Love & the Evidence',
      paras: [
        `<b class="sub">The Typical Mum</b>Think about your own mother. How many times has she stopped you from doing something you wanted? For the longest time â€” and honestly, even now â€” my mum keeps telling me to stay off my phone. You know the typical desi mum style: Me: "Amma, my foot is hurting." Her: "Beta, it's the phone." And maybe, if I really think about it, <b>it is the phone that is the issue.</b> She isn't trying to ruin my life. She's trying to protect it. She sees dangers that I don't.`,
        `<b class="sub">The Haram Always Does Harm</b>My mum always wanted to protect me, even at times I couldn't understand the harm. The same way â€” <b>why would the One who created us want to put unnecessary restrictions on us?</b> If Allah has called something haram, it is only for our own good. Allah does not make something haram to make our lives miserable. <b>He makes things haram because He knows the harm before we do.</b> As I like to say: <b>the haram is always going to do harm.</b>`,
        `<b class="sub">What's the Evidence?</b>Now you might be wondering: "What's the evidence that music is actually haram?" Fair question. Here you go â€” the IslamQA article <b>"Is Music Haram?"</b> <span style="color:var(--gold);font-weight:700;">(link to be added)</span>. It covers all of the following:`,
        `<ul><li><b>What is Ma'azif?</b></li><li><b>Evidence of prohibition of music and singing</b> in the Quran and Sunnah</li><li><b>Views of the scholars</b> on music and singing</li><li><b>Al-Daff:</b> an appropriate exception</li><li><b>Drums at times of war and military music:</b> an inappropriate exception</li><li><b>Story of the Abyssinians</b> playing and singing in the Prophet's mosque</li><li><b>Did the Companions listen to singing?</b></li><li><b>Are the hadiths which forbid music full of faults?</b></li><li><b>Is singing haram only where alcohol is drunk?</b></li><li><b>Does "idle talk" refer to singing?</b></li><li><b>Is singing a form of worship if it helps one obey Allah?</b></li><li><b>Does music soften people's hearts?</b></li><li><b>Conclusion</b> and reference</li></ul>`,
        `Please, please read it with an open heart. <b>As Muslims, our first source of guidance is the Qur'an and the authentic Sunnah.</b> Scientific studies and statistics can help us appreciate Allah's wisdom, but they do not determine what is halal or haram. <b>The One who created our minds, our hearts, our purpose, and our entire existence knows us better than we know ourselves.</b> And if He tells us something is harmful... then perhaps it is because He loves us far more than we can comprehend. Allah.`,
        `<b class="sub">It All Starts From the Mindset</b>I don't want you to look at this journey as something unpleasant â€” <b>you're not "quitting music." This journey is about self-improvement.</b> Imagine eight billion people in this world, and Allah chose you. He chose you to show you the reality of music. Now it is your turn to decide: will you accept the blessing or reject it? I pray to Allah that He accepts your efforts and makes your life a journey toward betterment for His sake. <b class="dua">Ameen.</b>`
      ],
      tomorrow: `<b>Coming tomorrow:</b> the wake-up call â€” death is closer than we think, and the beginning of the journey into what music does to your brain, starting with the dopamine loop.`
    },
    {
      title: 'Death Is Closer & the Dopamine Loop',
      paras: [
        `<b class="sub">Is Tomorrow Promised to You?</b>Most of you might be thinking, "I can just change later. I want to enjoy my youth right now. Just wait till I turn 70." My dearest brothers and sisters â€” <b>is tomorrow promised to you? Do you control your heartbeat?</b> I too thought like you, until I saw with my own eyes and heard with my own ears. A 15-year-old named Umer Shah died after his own vomit entered his lungs â€” death by the will of Allah.`,
        `<b>Over 1.5 million adolescents and young adults aged 10â€“24 died globally in 2021 â€” averaging about 4,500 deaths every day</b> â€” according to the World Health Organization. I hope that was enough to motivate you.`,
        `<b class="sub">What Does Music Do to Our Brains?</b>Now, another question that needs to be answered is: <b>what does music do to our brains?</b> Let's start with the dopamine loop. What is dopamine? I'll try to make it as un-nerdy as possible, I promise. <b>Dopamine is a chemical released to motivate us. It's like our own personal cheerleader.</b> But you'll be asking â€” what's wrong with that? Isn't that a good thing? Well, it is â€” at least the real dopamine that Allah placed in us, for example when we <b>push through laziness</b> or <b>stay consistent on a goal.</b>`,
        `<b class="sub">The Problem Isn't Dopamine</b><b>The issue isn't dopamine â€” it's where you get it from.</b> We get our dopamine from shady places â€” the cheap, manufactured kind. Instead of earning dopamine the right way, we take shortcuts. We want it fast, easy, and lots and lots of it. Of course, Shaytan is like, "At your service, sir / madam â€” one shot of music right away." <b>The anticipation before the drop? Dopamine. The chills you get on that beat? Dopamine. The lyrics stuck in your head? Dopamine.</b>`,
        `This might seem like it's not really that deep, but trust me, it is. Why? <b>We train our brains to seek dopamine through the wrong ways â€” which automatically makes all the stuff that was supposed to give us healthy dopamine seem "boring."</b> Have you noticed how life just doesn't feel so rewarding anymore? How your salah has lost khushu', and the Quran feels like a burden? Or how you'd prefer blasting music in your headphones over cleaning your room, because the former seems more rewarding? Or how sitting in silence or completing goals on time feels impossible now? Yeah â€” well, at least I did.`,
        `<b class="sub">Evidence: Music Activates the Reward System</b>Researchers scanned people's brains while they listened to music that gave them chills. <b>They found dopamine release in the striatum, a key reward area of the brain.</b> This helps explain why music can feel highly rewarding. <span class="ref"><b>Reference:</b> Salimpoor, V. N., Benovoy, M., Larcher, K., Dagher, A., & Zatorre, R. J. (2011). "Anatomically distinct dopamine release during anticipation and experience of peak emotion to music." <i>Nature Neuroscience</i>, 14(2), 257â€“262. DOI: 10.1038/nn.2726.</span>`
      ],
      tomorrow: `<b>Coming tomorrow:</b> your emotions â€” low-key scripted. How music plants feelings in you without you noticing, and why those lyrics get stuck in your head instead of your exam formulas.`
    },
    {
      title: 'Your Emotions Are Scripted',
      paras: [
        `<b class="sub">Your Emotions? Low-key Scripted.</b>Have you ever had moments where you turn on some very aesthetic sad song when you weren't even sad â€” and five minutes later, you're questioning life, missing people you never even met, and suddenly feeling like the main character going through some identity crisis? Yeah, that's not random. <b>That's your emotions being engineered.</b>`,
        `Psychologists call it <b>"Emotional Entrainment"</b> â€” where your mood syncs with the tone of the music, even if you weren't feeling that way before. Your brain starts borrowing emotions from the song, and the more you loop it, the more it sticks. <b>You don't feel sad â€” the music makes you sad. You weren't thinking haram â€” the lyrics planted the thought. You weren't angry â€” the beat charged you up.</b>`,
        `Scientific studies back this up: <b>lustful songs increase sexual thoughts and desire, even without any visual content; aggressive music raises testosterone and impulsive behavior, especially in young men; prideful, ego-driven lyrics can literally amplify narcissistic traits, especially when repeated.</b> And most of the time, you won't even notice it's happening â€” because the song doesn't say, "Hey, I'm brainwashing you." It just makes you feel something, until those feelings become your reality. So no â€” you're not just "vibing." <b>You're being emotionally programmed, one song at a time.</b>`,
        `<b class="sub">Evidence: Music Affects Emotions</b>Music reliably changes emotional states. <b>Researchers found it activates emotional networks, including the amygdala and limbic system.</b> <span class="ref"><b>Reference:</b> Koelsch, S. (2014). "Brain correlates of music-evoked emotions." <i>Nature Reviews Neuroscience</i>.</span>`,
        `<b class="sub">Memory? Focus? Worship? All Cooked.</b>Ever wondered why you remember the lyrics of a reel or a song instead of the actual formula at the exam centre? Like I literally can see the page open in front of me, but when I try to recall "F = ma," all my brain repeats is "Baby Shark, du du du..." Why does that even happen? <b>The answer: earworms.</b> An earworm is a real psychological phenomenon â€” when a song, beat, or lyric gets stuck in your mind and keeps repeating involuntarily. It's not random; it's how the brain processes repeated audio, especially catchy music. These repetitive loops activate your auditory cortex and stay lodged in your working memory â€” <b>the same space your brain uses to reflect, memorize, and concentrate.</b>`,
        `Scientifically, music â€” especially repetitive songs â€” hijacks your brain's attention resources. It competes with your mental bandwidth. And spiritually, <b>it blocks khushu' by making it harder to stay present with Allah.</b> Even worse, the same brain circuits that form emotional and long-term memory are triggered more by songs than by speech. That's why you remember lyrics easily but find it difficult to memorize a Surah from the Quran. <b>Those lyrics stuck in your head are the reason you feel distant from the Qur'an â€” not because you're weak, but because your mental space is already occupied.</b>`,
        `<b class="sub">References</b><ul><li><b>Earworms (INMI):</b> Liikkanen, L. A. (2012). "Musical activities predispose to involuntary musical imagery." <i>Psychology of Music</i>.</li><li><b>Mere exposure effect:</b> Zajonc, R. B. (1968). "Attitudinal effects of mere exposure." <i>Journal of Personality and Social Psychology</i>.</li><li><b>Emotion regulation:</b> Saarikallio, S., & ErkkilÃ¤, J. (2007). "The role of music in adolescents' mood regulation." <i>Psychology of Music</i>.</li><li><b>Neuroplasticity:</b> Doidge, N. (2007). <i>The Brain That Changes Itself</i>.</li><li><b>Attention:</b> Perham, N., & Currie, H. (2014). "Does listening to preferred music improve reading comprehension?" <i>Applied Cognitive Psychology</i>.</li><li><b>Lyrics influence thoughts:</b> Anderson, C. A., Carnagey, N. L., & Eubanks, J. (2003). "Exposure to violent media: the effects of songs with violent lyrics on aggressive thoughts and feelings." <i>Journal of Personality and Social Psychology</i>.</li><li><b>Music and craving:</b> Zatorre, R. J. Various papers on music and the brain (McGill University).</li></ul>`
      ],
      tomorrow: `<b>Coming tomorrow:</b> the genres â€” what rap &amp; trap, pop, sad songs, and metal actually do to your brain and your soul.`
    },
    {
      title: 'The Genres',
      paras: [
        `<b class="sub">Rap &amp; Trap</b>The bass is booming, the beat drops harder than your motivation on a Monday, and the lyrics are somewhere between "I'm the best" and "I don't need nobody." But here's the kicker: it's not just music â€” it's a confidence cocktail, with a side of delusion. Here's what's happening in your brain: <b>every "bar" activates your dopamine system; aggressive or competitive lyrics boost testosterone, making you feel powerful, even if you're literally just lying in bed with Doritos on your shirt; and your brain starts chasing the feeling of dominance, not real growth.</b> It slowly builds a personality that values image over substance, hype over heart, and flex over faith. And the worst part? You think it's empowering, but it's actually <b>replacing your confidence with arrogance and numbing your ability to feel human.</b>`,
        `<b class="sub">Pop</b>Pop music is basically that one friend who says a lot without saying anything. It's catchy, repetitive, easy to hum â€” and that's the point, because the simpler it is, the faster it loops in your head. <b>Its repetitive melodies activate your brain's reward system like sugar does: instant dopamine, zero nutrition. The lyrics are usually vague but emotionally charged, so your brain fills in the blanks and makes the song feel personal, even when it's not.</b> And that's how you end up dancing to heartbreak, vibing to loneliness, and smiling through pain that isn't even yours. <b>Pop is emotional junk food</b> â€” fun in the moment, but it trains your brain to chase emotional stimulation, not emotional depth. You struggle to sit with real feelings. You start to associate healing with distraction. You process your emotions through sound bites instead of soul work. It's not just "light-hearted music" â€” <b>it's escapism disguised as entertainment.</b>`,
        `<b class="sub">Sad / Emo</b>We've all had that phase: hoodie on, lights off, and that one sad song on loop because "nobody gets me." And for a while, it feels comforting â€” like the song understands you. But here's what's actually going on beneath the surface: <b>sad / emo songs activate your limbic system, the emotional center of your brain, and trigger the release of oxytocin and prolactin â€” hormones that soothe you during emotional pain. Instead of helping you move on, your brain learns to associate that pain with comfort. So you go back, not to heal, but to feel again.</b> It's a psychological trap that reinforces the idea that sadness is your safe space and your identity. Over time, you stop chasing peace and start chasing pain you can relate to. <b>This genre doesn't help you heal â€” it just teaches you to cope with sadness by replaying it.</b> Healing becomes something you keep planning to do, but never actually start.`,
        `<b class="sub">Metal / Rock</b>This is the only genre where almost every mainstream artist openly glorifies Shaytan â€” not symbolically, but literally. They perform satanic rituals on stage, mock scripture, praise the devil in interviews, and flash occult symbols like badges of honor. The lyrics aren't poetic metaphors â€” <b>they're satanic scripts.</b> Some artists admit they didn't write them, others say the words "just came to them," and a few straight-up confessed they were written by the devil himself. These tracks are da'wah to Jahannam.`,
        `The music? It's loud, violent, chaotic â€” harsh frequencies, disturbing riffs, grotesque visuals. <b>This isn't just sound; it's spiritual disruption. You're not being entertained; you're being invaded.</b> Here's what it does to you: <b>the violent stimulation activates your body's fight-or-flight mode. Your brain panics at the screaming, the drumming, the imagery. Cortisol spikes, your heart races, and slowly, you get addicted to the adrenaline. You crave rage. You call pain "release." You start mistaking noise for power.</b> And Shaytan? He's smiling â€” because you're consuming a ritual disguised as a track and calling it your "taste in music." So just to be clear: <b>you're not just listening to music â€” you're indirectly participating in a ritual.</b>`
      ],
      tomorrow: `<b>Coming tomorrow â€” the final day:</b> sound frequencies, how repetition programs you, emotional control, and the conclusion that brings it all home.`
    },
    {
      title: 'Frequencies, Programming & the Conclusion',
      paras: [
        `<b class="sub">Sound Frequencies</b>Every sound you hear is a vibration â€” and that includes music. Every beat, every bass drop, every synth is a vibration. And your brain works on frequencies too. Scientists call them brainwaves, and they control your mental state: focus, relaxation, stress, sleep, alertness â€” all of it. <b>Your brain can literally sync to external frequencies. It's called brainwave entrainment â€” when consistent rhythmic sound patterns influence your brain to match their pace.</b>`,
        `For example: <b>fast, loud beats = high-frequency brainwaves = stress, arousal, anxiety; slow, low-frequency beats = lower brainwaves = drowsiness, sadness, foggy thinking; repetitive rhythms = trance-like alpha/theta states = mental autopilot.</b> Music producers study this. They engineer frequencies to trigger exact states of mind â€” to make you zone out, get hyped, or even dissociate. And just to be clear, that's not a conspiracy; <b>it's neurological conditioning.</b> What you think is "vibing" is actually your brain syncing to an audio pattern â€” sometimes uplifting, but often overstimulating, numbing, or manipulative.`,
        `<b class="sub">Repetition Programs You</b>Let's be honest â€” some songs are mid, but you still end up vibing to them after a few listens. Why? <b>That's cognitive hypnosis at work.</b> Modern music thrives on repetition: the same chorus, the same beat structure, the same rhythm looping again and again. That eventually triggers your brain's <b>mere-exposure effect</b> â€” a psychological phenomenon where you start liking something just because it feels familiar. Platforms like Instagram and TikTok take it further, turning ten-second audio clips into viral loops you hear twenty times a day. Add auto-tune, predictable chord progressions, and dopamine-friendly build-ups, and you've got a perfect trap. <b>You're not choosing the song â€” the song is programming your preference.</b> It's designed to bypass your attention, sneak into your memory, and stay there. That's why even when you hate a song, you catch yourself humming it days later.`,
        `<b class="sub">Emotional Control</b>Producers layer specific frequencies with hypnotic patterns to control what you feel, when you feel it, and how long it lasts. The lyrics, the tempo, and the structure are built to evoke emotion on command â€” that's why songs can make you feel heartbreak you've never lived, pride you haven't earned, or lust you never sought out. <b>Over time, your emotions become externally controlled. You start depending on music to feel something, anything â€” because your internal compass for peace, joy, or focus has been drowned in artificial emotion.</b> And that's where the danger lies: when your emotions are engineered by sound, you're no longer fully in control.`,
        `<b class="sub">Conclusion</b>So once again, very respectfully â€” no, it's not "just music." <b>It's a carefully designed mix of frequency, repetition, and emotion meant to keep you hooked, programmed, and disconnected from real stillness.</b> And unless you're aware of it, you won't even notice it's happening â€” not because you're weak, but because it was built to bypass your defence system altogether. And it's not just music: <b>dopamine also spikes when you binge junk food, watch porn, scroll mindlessly for hours, chase haram pleasures, or take drugs, drink, or vape.</b> Each one is engineered to overload your brain with dopamine. But instead of motivating you to become better, they fry your focus, kill your memory, ruin your Qur'an retention, and leave your soul begging for real peace. And the most dangerous part? <b>You feel "good," but deep down, your soul is being destroyed. That's how dopamine works â€” it doesn't check if something is good for you; it just rewards whatever you repeat.</b>`,
        `<b class="dua">The haram always does harm. You are worth more than a beat, more than a loop, more than a passing "high." You were chosen to see this. Now choose to act.</b> May Allah accept your efforts and make this the beginning of a journey toward Him. <b class="dua">Ameen.</b>`
      ],
      tomorrow: `You made it through all seven days. <b>Week 2 is now unlocked.</b>`
    }
  ]
}
var WEEK2 = {
  title: 'Identify â€” Finding Your Why',
  dayTitles: ['The Challenge Begins', 'When Do You Listen?', 'What Drives You to Press Play?', 'How Does It Leave You?', 'What Were You Playing?', 'What If You Hadn\u2019t?', 'The Final Night'],
  intro: [
    `<b class="sub">Finding Your Why</b>Imagine you are baking a cake. First, you need to know what a cake is. Then you need the ingredients it requires â€” different flavours and types require different compositions and materials.`,
    `The same applies to us. We might all be listening to music, but we are doing it for different reasons. I used to listen to forget. You might listen to relax. So step two is â€” drum roll, please â€” <b>finding why <i>you</i> listen to music.</b> Not Shagufta, not Justin. You.`,
    `<b class="sub">Your 7-Day Journal Challenge</b>For the next seven days, grab a journal â€” you can decorate it and make it pretty, or not â€” but for the whole week, answer these questions every night before sleeping. It only takes about five minutes, I promise. <b>Everyone says we Gen Z / Gen Alpha cannot do anything consistently anymore. Let us prove them wrong, shall we?</b> For the sake of Allah SWT.`

  reminder: `<b class="sub">Night Journal</b>Same five questions tonight. Answer them in your own journal first, then tick off each box below.`,

    { q: 'What part of the day do I listen to music the most?', hint: 'Morning, commute, study time, before bed? Be specific.' },
    { q: 'How do I feel or think before listening to it?', hint: 'Bored? Anxious? Sad? Excited? Or is it just habit?' },
    { q: 'How do I feel after listening to it?', hint: 'Better? The same? Worse? Numb? Be honest.' },
    { q: 'What kind of music was it?', hint: 'Genre, artist, specific song â€” capture the details.' },
    { q: 'How would my day have been different if I had not listened to it?', hint: 'Would anything actually change? Or would it just feel different?' }
  ],
  exercises: [
    { title: '1 Â· Video Recording', text: 'Record yourself on camera looking directly into the lens. Tell yourself why you want to leave music behind â€” tell it like no one is watching but your future self. This might feel uncomfortable, but trust the process. You will understand why later, in sha Allah.' },
    { title: '2 Â· Document Your Journey', text: 'Keep a record of this week in a journal or on your phone. Track your reflections, patterns, and progress. This becomes your anchor when things get difficult. It does not matter if it is on paper or not â€” just keep the intention of recording this whole journey of yours.' }
  ]

var WEEK3 = {
  title: 'Act â€” Your Toolkit',
  intro: [
    `<b class="sub">Before You Explore</b>I tried my best to give you the solutions, but this is just a guide â€” you yourself will have to experiment with this and all.`
  ],
  triggers: [
    {
      title: 'Loneliness â€” On Feeling Unseen or Disconnected',
      steps: [
        'Identify what your loneliness is actually telling you. Sit with it and ask yourself: do you feel like people do not understand you? That no one reaches out? That you do not belong? Get specific. Loneliness looks different for everyone. The goal is to find the exact thought pattern underneath it, not just the feeling on the surface.',
        'Work on your thought style first. Once you have identified the pattern, gently challenge it. Is it really true that no one understands you, or is it that you have not let them in fully? Our minds can tell stories that protect us but also isolate us. Changing the thought pattern â€” not suppressing it â€” is the real work.',
        'Communicate with the people already in your life. Tell a friend how you have been feeling. You do not need a perfect conversation â€” just open the door. Vulnerability usually brings people closer than silence does.',
        'Find new connections within your values. Look for people who share your interests, your faith, or your mindset. Keeping Islamic boundaries does not limit connection â€” it actually grounds it in something real and lasting. Quality over quantity, always.',
        'Consider getting a pet. Animals offer a form of companionship that is quiet, consistent, and uncomplicated. Even the simple routine of caring for something else can ease the weight of loneliness in a surprising way.',
        'Build your connection with your Lord. The deepest antidote to loneliness is knowing you are never truly alone. Strengthening your relationship with Allah through dhikr, prayer, and reflection fills a space that no human connection fully can. Start small, be consistent, and notice what shifts.'
      ],
      link: { label: 'Recommended: Building Your Connection with Allah', url: 'https://www.youtube.com/live/7LyoBs9SCYc?si=qqwKYETCjbt5Ke-B' }
    },
    {
      title: 'Boredom â€” On Feeling Empty or Stuck',
      steps: [
        'Dig into what is actually underneath the boredom. Ask yourself: Why are you bored right now? Sometimes it is not a lack of things to do â€” it is a lack of energy to do them. If that resonates, look at your foundations first: diet, sleep, and movement. These are not small things â€” they genuinely change your capacity to engage with life.',
        'Ask the harder questions. Once your basics are sorted, go deeper. Am I living a life that feels meaningful? If today were my last, would I be satisfied with how I spent it? You will be asked about your time â€” that is not meant to frighten you, but to sharpen your focus. Boredom is often a signal that something important is being avoided.',
        'Find your purpose and start moving toward it. Not everyone knows their purpose immediately, and that is okay. But start asking: What gifts do you have? What problems move you? What would you do even if no one were watching? Purpose does not announce itself â€” you discover it through honest living. Begin there.'
      ],
      link: { label: 'Highly Recommended: Finding Your Purpose', url: 'https://youtu.be/_f28bNVZ3lQ' }
    },
    {
      title: 'Need to Express â€” On Having Feelings with Nowhere to Go',
      steps: [
        'Recognise that expression is a need, not an indulgence. If you feel pressure building, like something inside needs to get out â€” that is not weakness. It is a human need. The question is not whether to express, but how.',
        'Explore physical outlets. Swimming, boxing, running. Movement is one of the oldest forms of emotional release. There is something about physically moving that shifts what is happening in your mind. Try a few and see what resonates.',
        'Try creative outlets. Sketching, art, journaling, poetry. These are not just hobbies â€” they are ways of translating internal experience into something external and real. You do not need to be good at it. You just need to begin.',
        'Give yourself permission to explore. You do not have to commit to anything right away. Try different things without pressure. Expression is personal â€” what works for someone else might not work for you, and that is completely fine.'
      ]
    },
    {
      title: 'Constant Want for Stimulation â€” The Itch That Nothing Scratches',
      steps: [
        'Understand what is happening in your brain. The modern world is designed to keep you seeking the next hit: scrolling, notifications, fast content. Over time, this rewires your brain to need more and more stimulation just to feel normal. Recognising this is not a character flaw â€” it is a system you are operating inside of.',
        'Replace, do not just remove. Trying to cut out stimulation does not work for most people if you go cold turkey. Instead, swap low-quality stimulation for high-quality stimulation: a physically demanding sport, a craft that requires skill and focus, learning something genuinely challenging, or engaging conversations. These satisfy the need without depleting you.',
        'Practice doing less, gradually. Build a tolerance for quiet. Start with five minutes of doing nothing in particular: no phone, no music, no input. It will feel uncomfortable at first. That discomfort is the withdrawal. Over time, you will start to find peace in the stillness you once avoided.',
        'Try nature, movement, and presence. A walk outside without your phone, a workout that demands your full attention, cooking a meal from scratch â€” these are all forms of real-world stimulation that ground you rather than scatter you. Nature in particular has a way of quieting the noise.',
        'Be curious about the craving, not just the fix. When the urge hits, pause and ask: What am I actually looking for right now? Distraction? Connection? A sense of aliveness? Sometimes naming the real need makes the craving lose some of its grip and points you toward something that actually satisfies it.'
      ]
    }
  ],
  roadmap: {
    intro: 'The path many have followed before you â€” one step at a time, from familiar sounds to a heart that no longer needs them.',
    phases: [
      { title: 'Start with Acapellas', text: 'Tune into vocal-only versions to help you adjust to lyrics-only content.' },
      { title: 'Move to Nasheeds', text: 'Shift toward spiritually oriented content.' },
      { title: 'Address Your Specific Trigger', text: 'Use the solutions below that match your identified need from Week 2.' }
    ]
  },
  subs: [
    { title: 'Acapella channels', text: 'Vocal-only versions of songs you used to love, stripped of the music that harms you.' },
    { title: 'Nasheeds', text: 'Clean vocals and powerful words, sung for Allah without the beat.' },
    { title: 'Podcasts', text: 'Islamic podcasts and talks â€” let your ears learn instead of only feel.' }
  ],
  steps: [
    { title: 'The 1% Technique', text: 'When you take steps to make something 1% harder or 1% easier, your brain treats it that way too. Let us say in the summer you are not able to drink much water â€” just keep a water bottle and a glass by your bedside, and suddenly your brain does not have to worry about going to the kitchen each time.<br><br>Similarly, you can make music 1% harder to access:<br>&bull; Keep your headphones far away<br>&bull; Delete your music playlists<br>&bull; Make a new Spotify account that is halal-coded with Islamic content only<br>&bull; Unfollow music accounts on social media<br>&bull; Change your notification settings' },
    { title: 'The Visualization Technique', text: 'Vividly imagine yourself wanting to listen to music. Bring in the emotions, the wanting, everything. Picture yourself in detail searching for your favourite song. Your finger is hovering over the play button. And just as you are about to hit play, you leave it and go about your day.<br><br>Practice this visualisation a couple of times a day. I know it sounds crazy, but just give it a try. The brain processes visualised scenarios as real experiences.' },
    { title: 'Tell a Friend', text: 'Tell one trusted friend about this challenge. Ask them to support you and check in with you. Start the challenge together if possible. Accountability is powerful.' },
    { title: 'Listen to the Qur\u2019an', text: 'Replace the playlists with Qur\u2019an audio. Let the words of Allah fill the time your ears used to give to music â€” before long, the recitation becomes what your heart actually craves. Listen to it in the car, while you work, before you sleep.' }
  ],
  relapse: {
    title: 'I Slipped â€” What Now?',
    intro: 'Slipping is not the end. The Prophet ï·º said: "Every son of Adam sins, and the best of those who sin are those who repent." (Tirmidhi) Here is your comeback.',
    steps: [
      { title: 'Analyze', text: 'Do not wallow â€” investigate. What time was it? What were you feeling? Where were you? One honest answer turns a slip into information you can use. Re-check your triggers.' },
      { title: 'Repent', text: 'Go to Allah. He says: "O My servants who have transgressed against themselves, do not despair of the mercy of Allah. Indeed, Allah forgives all sins." (39:53) Seek istighfar, then move on. Do not let Shaytan keep you in guilt â€” that is his trap.' },
      { title: 'Do Good', text: 'A bad deed is wiped out by a good deed. Pray, read Qur\u2019an, help someone, do one of your practical steps. Do not just say sorry â€” show it with action.' },
      { title: 'Time & Trying Are Enough', text: 'Your clean days are not erased by one slip. You have not failed the journey; you took one step back on a road you are still walking. Get up, mark today, and keep going.' }
    ]
  }
}

function toggleDarkMode() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
  document.querySelector('.mode-toggle').textContent = newTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
}
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.querySelector('.mode-toggle').textContent = 'Light Mode';
}

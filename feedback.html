<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Feedback — Nafs Warrior</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f2efe6;--bg-card:#faf8f2;
  --sage-mid:122,153,114;--sage-dark:64,68,44;
  --ink:42,45,26;--ink-mid:64,68,44;--ink-soft:103,112,85;
  --line:rgba(64,68,44,.13);
  --font-d:'Cormorant Garamond',serif;--font-b:'Manrope',sans-serif;
}
[data-theme="dark"]{
  --bg:#181a1b;--bg-card:#202325;
  --sage-mid:181,200,174;--sage-dark:200,216,192;
  --ink:242,239,230;--ink-mid:200,216,192;--ink-soft:156,177,148;
  --line:rgba(156,177,148,.15);
}
body{background:var(--bg);color:rgb(var(--ink));font-family:var(--font-b);line-height:1.8;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;min-height:100svh;}

header{position:sticky;top:0;z-index:20;background:var(--bg-card);border-bottom:1px solid var(--line);padding:14px 48px;display:flex;align-items:center;justify-content:space-between;}
.logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-link svg{width:36px;height:36px;}
.logo-name{font-family:var(--font-d);font-size:1.4rem;font-weight:700;color:rgb(var(--sage-dark));}
.header-right{display:flex;align-items:center;gap:12px;}
.theme-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:rgb(var(--sage-dark));display:flex;align-items:center;transition:background .2s;}
.theme-btn:hover{background:rgba(var(--sage-mid),.1);}
.theme-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.back-btn{font-size:.85rem;font-weight:600;color:rgb(var(--ink-soft));text-decoration:none;transition:color .2s;}
.back-btn:hover{color:rgb(var(--sage-dark));}
@media(max-width:600px){header{padding:14px 20px;}.logo-name{font-size:1.1rem;}}

main{max-width:680px;margin:0 auto;padding:48px 24px 80px;}
.page-h1{font-family:var(--font-d);font-size:clamp(2.2rem,6vw,3.2rem);font-weight:700;color:rgb(var(--sage-dark));margin-bottom:10px;}
.page-sub{font-size:1.05rem;color:rgb(var(--ink-mid));margin-bottom:36px;}
.iframe-wrap{width:100%;}
.iframe-wrap iframe{width:100%;height:900px;border:none;border-radius:16px;background:var(--bg-card);}
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-link">
    <svg viewBox="0 0 120 120" fill="none">
      <circle cx="60" cy="60" r="56" fill="rgb(122,153,114)" opacity=".85"/>
      <path d="M60 22 A38 38 0 1 0 60.001 22" stroke="rgb(220,232,212)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <line x1="60" y1="58" x2="60" y2="22" stroke="rgb(220,232,212)" stroke-width="5.5" stroke-linecap="round"/>
      <polyline points="47,34 60,21 73,34" stroke="rgb(220,232,212)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="logo-name">Nafs Warrior</span>
  </a>
  <div class="header-right">
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <a href="index.html" class="back-btn">← Back home</a>
  </div>
</header>

<main>
  <h1 class="page-h1">Share Your Feedback</h1>
  <p class="page-sub">The feedback is completely anonymous.</p>
  <div class="iframe-wrap">
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSfxT4OegKZIzB-TyEzYsgMPM3henAk_xuK0-cbXDf0AI_QFKA/viewform?embedded=true"
      title="Feedback form"
    >Loading…</iframe>
  </div>
</main>

<script>
(function(){ document.documentElement.setAttribute('data-theme', localStorage.getItem('nw_theme')||'dark'); })();
function toggleTheme(){ var h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark'; h.setAttribute('data-theme',n); localStorage.setItem('nw_theme',n); }
</script>
</body>
</html>
